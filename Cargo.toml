[package]
name = "linux_legion"
version = "0.1.2"
edition = "2021"
description = "Linux control center for Lenovo Legion laptops: power modes, fans, Spectrum RGB, battery"
license = "MIT"
repository = "https://github.com/VitaminDB/linux-legion"

[[bin]]
name = "linux_legion"
path = "src/main.rs"

[dependencies]
syngui = { git = "https://github.com/VitaminDB/syngui.git", branch = "master", default-features = false, features = [
    "winit", "msdf", "effects", "material-icons", "image",
] }
libc = "0.2"

[profile.dev]
opt-level = 1

[dev-dependencies]
syngui = { git = "https://github.com/VitaminDB/syngui.git", branch = "master", default-features = false, features = [
    "winit", "msdf", "effects", "material-icons", "image", "testing",
] }

# Быстрая release-сборка для локальной работы: без LTO, параллельная
# кодогенерация, инкрементальная, без отладочной информации — в разы быстрее
# линкуется ценой 5–15% скорости. `cargo build --profile fast-release`
# (бинарники в target/fast-release). `--release` — только для публикаций.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = false
