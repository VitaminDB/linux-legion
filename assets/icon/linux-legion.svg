<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- фон: глубокий графит с фиолетовым отливом -->
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#232042"/>
      <stop offset="0.55" stop-color="#11121f"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7c5cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <!-- RGB-дуга -->
    <linearGradient id="rgb" gradientUnits="userSpaceOnUse" x1="140" y1="380" x2="410" y2="200">
      <stop offset="0" stop-color="#00e0ff"/>
      <stop offset="0.35" stop-color="#4f7bff"/>
      <stop offset="0.65" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e0ff"/>
      <stop offset="0.5" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <!-- буква: металл сверху вниз -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cfe0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="110"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#bloom)"/>
    <rect x="16" y="16" width="480" height="240" fill="url(#gloss)"/>
    <!-- подсвеченная полоса снизу, как световая полоса ноутбука -->
    <rect x="96" y="446" width="320" height="30" rx="15" fill="url(#bar)" filter="url(#soft)" opacity="0.8"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="108.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- дорожка индикатора 270° -->
  <path d="M149.9 368.1 A150 150 0 1 1 362.1 368.1" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="22" stroke-linecap="round"/>
  <!-- RGB-дуга индикатора -->
  <path d="M149.9 368.1 A150 150 0 1 1 403.2 233.1" fill="none" stroke="url(#rgb)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <!-- деления -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="92" x2="256" y2="104"/>
    <line x1="376" y1="142" x2="368" y2="150"/>
    <line x1="136" y1="142" x2="144" y2="150"/>
    <line x1="426" y1="262" x2="414" y2="262"/>
    <line x1="86" y1="262" x2="98" y2="262"/>
  </g>

  <!-- угловатая «L» -->
  <path d="M198 160 h52 v140 l-12 16 h96 l-16 38 H198 Z" fill="#000000" opacity="0.35" filter="url(#soft)" transform="translate(0 8)"/>
  <path d="M198 160 h52 v140 l-12 16 h96 l-16 38 H198 Z" fill="url(#metal)"/>
  <path d="M198 160 h52 v6 h-52 Z" fill="#ffffff" opacity="0.9"/>

  <!-- световая полоса -->
  <rect x="136" y="438" width="240" height="12" rx="6" fill="url(#bar)"/>
</svg>
